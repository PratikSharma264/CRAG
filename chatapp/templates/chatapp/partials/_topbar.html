<header class="topbar">
  <button type="button" class="topbar__menu" aria-label="Open menu" aria-controls="sidebar" data-sidebar-toggle>
    <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
  </button>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <span>Clinical RAG</span>
    <span aria-hidden="true">/</span>
    <span class="breadcrumb__current">{% if request.resolver_match.url_name == 'knowledge_base' %}Knowledge base{% else %}Chat{% endif %}</span>
  </nav>

  <div class="topbar__actions">
    <button type="button" class="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" data-theme-toggle>
      <svg class="icon theme-toggle__sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="icon theme-toggle__moon" aria-hidden="true"><use href="#i-moon"/></svg>
    </button>

    <span class="topbar__divider" aria-hidden="true"></span>

    <form action="{% url 'chatapp:logout' %}" method="post">
      {% csrf_token %}
      <button type="submit" class="logout-btn">
        <svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>
        <span>Logout</span>
      </button>
    </form>
  </div>
</header>
